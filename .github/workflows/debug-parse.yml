name: debug-parse
on:
  workflow_dispatch:
jobs:
  tokens:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $pr = [System.Management.Automation.Language.Parser]
          $tx = Get-Content ./server/setup-old-pc.ps1 -Raw
          $lns = $tx -split "`r?`n"
          function P($label, $from, $to) {
            $pre = ($lns[($from-1)..($to-1)] -join "`n")
            $a = $null
            $b = $null
            [void]$pr::ParseInput($pre, [ref]$a, [ref]$b)
            $hit = @($b | Where-Object {
              $_.Message -match "Missing argument"
            })
            if (@($hit).Count -gt 0) {
              Write-Host ($label + " BAD")
            } else {
              Write-Host ($label + " ok")
            }
          }
          P "Q113" 1 113
          P "Q115" 1 115
          P "Q116" 1 116
          P "Q117" 1 117
          P "Q120" 1 120
          P "S113" 113 113
          P "S117-119" 117 119
