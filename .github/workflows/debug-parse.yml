name: debug-parse
on:
  workflow_dispatch:
jobs:
  tokens:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $pr = [System.Management.Automation.Language.Parser]
          $tx = Get-Content ./server/setup-old-pc.ps1 -Raw
          $lns = $tx -split "`r?`n"
          function T($label, $from, $to) {
            $pre = ($lns[($from-1)..($to-1)] -join "`n")
            $a = $null
            $b = $null
            [void]$pr::ParseInput($pre, [ref]$a, [ref]$b)
            $hit = @($b | Where-Object {
              $_.Message -match "Missing argument"
            })
            if (@($hit).Count -gt 0) {
              Write-Host ($label + " BAD:")
              foreach ($x in $hit) {
                Write-Host ("  " + $x.Message)
              }
            } else {
              $o = @($b).Count
              Write-Host ($label + " ok(other=" + $o + ")")
            }
          }
          T "L111" 111 111
          T "L105-113" 105 113
          T "L100-112" 100 112
          T "L85-95" 85 95
          T "L115-122" 115 122
          $l112 = $lns[111]
          $hex = ([BitConverter]::ToString(
            [Text.Encoding]::UTF8.GetBytes($l112)))
          Write-Host ("L112-hex=" + $hex)
