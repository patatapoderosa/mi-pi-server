name: debug-parse
on:
  workflow_dispatch:
jobs:
  tokens:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $pr = [System.Management.Automation.Language.Parser]
          $tx = Get-Content ./server/setup-old-pc.ps1 -Raw
          $lns = $tx -split "`r?`n"
          function P($label, $from, $to) {
            $pre = ($lns[($from-1)..($to-1)] -join "`n")
            $a = $null
            $b = $null
            [void]$pr::ParseInput($pre, [ref]$a, [ref]$b)
            $hit = @($b | Where-Object {
              $_.Message -match "Missing argument"
            })
            if (@($hit).Count -gt 0) {
              Write-Host ($label + " BAD")
            } else {
              Write-Host ($label + " ok")
            }
          }
          P "P95" 1 95
          P "P100" 1 100
          P "P105" 1 105
          P "B95-112" 95 112
          P "B85-95" 85 95
          P "B93-101" 93 101
