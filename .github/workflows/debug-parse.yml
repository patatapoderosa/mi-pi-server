name: debug-parse
on:
  workflow_dispatch:
jobs:
  tokens:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $pr = [System.Management.Automation.Language.Parser]
          $tx = Get-Content ./server/setup-old-pc.ps1 -Raw
          $lns = $tx -split "`r?`n"
          function P($label, $to) {
            $pre = ($lns[0..($to-1)] -join "`n")
            $a = $null
            $b = $null
            [void]$pr::ParseInput($pre, [ref]$a, [ref]$b)
            Write-Host ($label + " n=" + @($b).Count)
            foreach ($x in @($b)) {
              Write-Host ("  L" + $x.Extent.StartLineNumber)
              Write-Host ("  " + $x.Message)
            }
          }
          P "P80" 80
          P "P84" 84
          P "P86" 86
          P "P88" 88
          P "P92" 92
