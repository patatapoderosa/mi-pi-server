name: debug-parse
on:
  workflow_dispatch:
jobs:
  tokens:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $pr = [System.Management.Automation.Language.Parser]
          $snips = @(
            'npm install -g @earendil-works/pi-coding-agent',
            '$x = Read-Host "Owner Telegram user id"',
            'icacls $Secrets /inheritance:r /grant:r "$env:U"',
            'if ($listed -match "pi-telegram") { Info "ok" }',
            '$listed = (pi list 2>$null | Out-String)',
            'try { pi install "npm:@llblab/pi-telegram" } catch { }',
            '$v = node -p "process.versions.node.split(1,2)[0]"',
            '$bak = "$Path.bak-$(Get-Date)"',
            'Write-Host "a @userinfobot b"'
          )
          $i = 0
          foreach ($s in $snips) {
            $i++
            $a = $null
            $b = $null
            [void]$pr::ParseInput($s, [ref]$a, [ref]$b)
            $c = @($b).Count
            Write-Host ("snip" + $i + " errors=" + $c)
            foreach ($x in $b) {
              Write-Host ("  " + $x.Message)
            }
          }
