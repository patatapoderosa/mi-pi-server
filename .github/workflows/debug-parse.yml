name: debug-parse
on:
  workflow_dispatch:
jobs:
  tokens:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $pr = [System.Management.Automation.Language.Parser]
          $tx = Get-Content ./server/setup-old-pc.ps1 -Raw
          $lns = $tx -split "`r?`n"
          function Show-Errs($label, $errs) {
            $hit = @($errs | Where-Object {
              $_.Message -match "Missing argument"
            })
            if (@($hit).Count -gt 0) {
              Write-Host ($label + " MISSING-ARG:")
              foreach ($x in $hit) {
                Write-Host ("  L" + $x.Extent.StartLineNumber)
                Write-Host ("  " + $x.Message)
              }
            } else {
              Write-Host ($label + " clean")
            }
          }
          foreach ($n in @(85, 90, 95, 100, 105, 108, 110, 112)) {
            $pre = ($lns[0..($n-1)] -join "`n")
            $a = $null
            $b = $null
            [void]$pr::ParseInput($pre, [ref]$a, [ref]$b)
            Show-Errs ("prefix-" + $n) $b
          }
          foreach ($ln in @(108, 109, 110, 111, 112, 113)) {
            $s = $lns[$ln - 1]
            $a = $null
            $b = $null
            [void]$pr::ParseInput($s, [ref]$a, [ref]$b)
            Show-Errs ("line-" + $ln) $b
          }
