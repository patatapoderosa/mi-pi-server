name: debug-parse
on:
  workflow_dispatch:
jobs:
  tokens:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          $pr = [System.Management.Automation.Language.Parser]
          $tx = Get-Content ./server/setup-old-pc.ps1 -Raw
          $lns = $tx -split "`r?`n"
          function P($label, $from, $to) {
            $pre = ($lns[($from-1)..($to-1)] -join "`n")
            $a = $null
            $b = $null
            [void]$pr::ParseInput($pre, [ref]$a, [ref]$b)
            Write-Host ($label + " n=" + @($b).Count)
            foreach ($x in @($b)) {
              Write-Host ("  L" + $x.Extent.StartLineNumber)
              Write-Host ("  " + $x.Message)
            }
          }
          P "P87" 1 87
          P "P89" 1 89
          P "P90" 1 90
          P "P91" 1 91
          P "S89" 89 89
          P "S90" 90 90
